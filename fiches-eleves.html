<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-title" content="Fiches élèves">
<meta name="theme-color" content="#1f5f8b">
<title>Fiches élèves AESH</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Mobile d'abord : code d'équipe une seule fois par téléphone, puis fiche directe */
:root{
  --bg:#f3f5f7; --surface:#fff; --ink:#18232e; --muted:#5b6977; --line:#dbe1e7;
  --accent:#1f5f8b; --accent-ink:#fff; --accent-soft:#e3eef6;
  --dys:#a36200; --dys-bg:#fdf1dc; --tdah:#b23a2c; --tdah-bg:#fbe6e2;
  --tsa:#5340a8; --tsa-bg:#ece8fb; --moteur:#2f7a45; --moteur-bg:#e2f3e7;
  --lang:#0d6f73; --lang-bg:#dff3f2; --emo:#9c3f78; --emo-bg:#f8e5f0;
  --sante:#4f5d6b; --sante-bg:#e7ebef; --girl:#b23a63; --girl-bg:#fbe4ec;
  --warn-bg:#fff7e6; --warn:#8a5a00;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Verdana",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11171d; --surface:#1a222b; --ink:#e8edf2; --muted:#9aa8b5; --line:#2c3743;
  --accent:#7db8e0; --accent-ink:#0f1a24; --accent-soft:#1d3346;
  --dys:#f2b558; --dys-bg:#3a2b12; --tdah:#f08a7c; --tdah-bg:#3d1f1b; --tsa:#ab9cf0; --tsa-bg:#2a2445;
  --moteur:#7fcf96; --moteur-bg:#1c3424; --lang:#6fd0d0; --lang-bg:#16322f; --emo:#e99ac8; --emo-bg:#3a1d30;
  --sante:#b5c2cf; --sante-bg:#28323c; --girl:#f39ab8; --girl-bg:#3b1d28; --warn-bg:#33270f; --warn:#f2c46d; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(48px,env(safe-area-inset-bottom));
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)} .small{font-size:13px} .none{color:var(--muted);font-style:italic}
.btn{padding:14px 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0;text-decoration:underline;font-size:14px}
/* code */
.gate{max-width:420px;margin:10vh auto 0;display:grid;gap:16px}
.gate h1{font-size:30px;font-weight:800}
.gate p{margin:0}
.gate input{padding:15px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:18px;width:100%}
.err{color:var(--tdah);font-weight:700}
/* liste */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px 12px;flex-wrap:wrap;margin:8px 0 12px}
.top h1{font-size:28px;font-weight:800}
.search{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-size:17px}
.sites{display:flex;gap:8px;overflow-x:auto;padding:12px 0 16px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start;text-align:left;
  background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;text-decoration:none;color:inherit}
.card .name{font-family:var(--f-display);font-weight:800;font-size:18px;display:block}
.card .meta{color:var(--muted);font-size:14px;display:block}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.avatar svg{width:36px;height:36px}
.av-F{background:var(--girl-bg);color:var(--girl)} .av-G{background:var(--accent-soft);color:var(--accent)} .av-{background:var(--sante-bg);color:var(--sante)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.t-dys{background:var(--dys-bg);color:var(--dys)} .t-tdah{background:var(--tdah-bg);color:var(--tdah)}
.t-tsa{background:var(--tsa-bg);color:var(--tsa)} .t-moteur{background:var(--moteur-bg);color:var(--moteur)}
.t-lang{background:var(--lang-bg);color:var(--lang)} .t-emo{background:var(--emo-bg);color:var(--emo)}
.t-sante,.t-autre{background:var(--sante-bg);color:var(--sante)}
.aesh{font-size:14px;display:block;margin-top:4px}
/* fiche */
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 0;font-size:16px}
.id{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center;margin:4px 0 14px}
.id .avatar{width:76px;height:76px} .id .avatar svg{width:52px;height:52px}
.id h1{font-size:28px;font-weight:800}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;margin:0 0 14px}
.facts div{background:var(--surface);padding:10px 12px;min-width:0}
.facts dt{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.facts dd{margin:2px 0 0;font-weight:700;overflow-wrap:anywhere}
.facts .wide{grid-column:1/-1}
.essentiel{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.essentiel h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;margin-bottom:8px}
.essentiel ol{margin:0;padding-left:22px;display:grid;gap:8px;font-size:17px;font-weight:700}
section.block{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
section.block>h2{font-size:20px;margin-bottom:10px}
.sub-h{font-size:15px;margin:14px 0 6px}
.sub-h small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:13px}
ul.items{margin:0;padding-left:20px;display:grid;gap:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.am{font-size:14px;padding:4px 10px;border-radius:8px;background:var(--accent-soft)}
.docs{display:grid;gap:8px}
.doc{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0;padding-bottom:0}
.doc b{font-size:14px}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px}
@media (max-width:480px){.doc{grid-template-columns:1fr;gap:2px}}
</style>
</head>

const KEY = "fiches-aesh-code";
const app = document.getElementById("app");

const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

const ICON = {
 F:`<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M24 6c-8 0-13 6-13 14v10c0 2 1 3 3 3h3v-6c-2-1-3-3-3-6 0-2 1-3 2-3 2-3 5-5 8-5s6 2 8 5c1 0 2 1 2 3 0 3-1 5-3 6v6h3c2 0 3-1 3-3V20c0-8-5-14-13-14z"/><path fill="currentColor" d="M24 30c-3 0-5-2-6-5v-4c2-2 4-3 6-3s4 1 6 3v4c-1 3-3 5-6 5zM12 44c1-6 6-10 12-10s11 4 12 10z"/></svg>`,

};
const dateFr = d => d ? new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}) : "";
const tags = (t,max) => (max?t.slice(0,max):t).map(x=>`<span class="tag t-${esc(x.c)}">${esc(x.l)}</span>`).join("") + (max&&t.length>max?`<span class="tag t-sante">+${t.length-max}</span>`:"");
const nom = f => `${esc(f.prenom)} ${esc(String(f.nom).toUpperCase())}`;
const list = a => `<ul class="items">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;

let FICHES = null, META = {}, site = "Tous", q = "";

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function ouvrir(code){
  const [salt, iv, ct] = DATA.split(".").map(b64);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:600000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const clair = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
  const d = JSON.parse(new TextDecoder().decode(clair));
  META = d; FICHES = d.fiches;
}

function gate(erreur){
  app.innerHTML = `<form class="gate" id="f">
    <h1>Fiches élèves</h1>
    <p class="muted">Réservé à l'équipe AESH. Tape le code d'équipe donné par la coordination. Ton téléphone s'en souviendra.</p>
    <label for="c" class="small"><b>Code d'équipe</b></label>
    <input id="c" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="ex. mot-mot-mot-123" required>
    ${erreur ? `<p class="err">Ce code ne fonctionne pas. Vérifie les tirets et l'orthographe.</p>` : ""}
    <button class="btn" type="submit" id="b">Ouvrir les fiches</button>
  </form>`;
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const code = document.getElementById("c").value;
    document.getElementById("b").textContent = "Ouverture…";
    try { await ouvrir(code); ls.set(code); route(); }
    catch(err){ gate(true); }
  };
}

function route(){
  if(!FICHES) return gate();
  const h = decodeURIComponent(location.hash.slice(1));
  const f = h && FICHES.find(x => x.id === h);
  f ? fiche(f) : liste(h ? "Cette fiche n'existe plus. Choisis l'élève dans la liste." : "");
  window.scrollTo(0,0);
}

function liste(alerte){
  const sites = ["Tous", ...new Set(FICHES.map(f=>f.site).filter(Boolean))];
  app.innerHTML = `<div class="top"><h1>Fiches élèves</h1><span class="muted small">${FICHES.length} élèves${META.annee?" · "+esc(META.annee):""}</span></div>
    ${alerte?`<p class="small err">${esc(alerte)}</p>`:""}
    <input class="search" id="q" type="search" placeholder="Prénom, nom, classe ou AESH…" aria-label="Chercher un élève" value="${esc(q)}" autocomplete="off">
    <div class="sites">${sites.map(s=>`<button class="chip" data-s="${esc(s)}" aria-pressed="${s===site}">${esc(s)}</button>`).join("")}</div>
    <div class="list" id="list"></div>
    <div class="foot"><span class="small muted">Données issues de Cockpit Coordo${META.export?" · "+dateFr(META.export):""}</span><button class="linkbtn" id="out">Oublier le code sur ce téléphone</button></div>`;
  const draw = () => {
    const s = norm(q);
    const it = FICHES.filter(f => (site==="Tous"||f.site===site) && norm(`${f.prenom} ${f.nom} ${f.nom} ${f.prenom} ${f.classe} ${f.aesh.map(a=>a.n).join(" ")}`).includes(s));
    document.getElementById("list").innerHTML = it.length ? it.map(f=>`<a class="card" href="#${esc(f.id)}">
      <span class="avatar av-${esc(f.sexe)}">${ICON[f.sexe]||ICON[""]}</span>
      <span><span class="name">${nom(f)}</span><span class="meta">${esc(f.classe)} · ${esc(f.site)}${f.pp?" · PP "+esc(f.pp):""}</span>
      <span class="aesh">${f.aesh.length?"AESH : <b>"+f.aesh.map(a=>esc(a.n)).join(", ")+"</b>":'<span class="none">Pas d\'AESH</span>'}</span>
      ${f.troubles.length?`<span class="tags">${tags(f.troubles,3)}</span>`:""}</span></a>`).join("") : `<p class="none">Aucun élève ne correspond.</p>`;
  };
  draw();
  document.getElementById("q").oninput = e => { q = e.target.value; draw(); };
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { site=b.dataset.s; document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x.dataset.s===site)); draw(); });
  document.getElementById("out").onclick = () => { ls.del(); FICHES=null; gate(); };
}

function fiche(f){
  const vide = !f.troubles.length && !f.preconisations.length && !f.observations.length;
  const doc = (k,v) => v ? `<div class="doc"><b>${k}</b><span>${v}</span></div>` : "";
  app.innerHTML = `<button class="back" id="back">← Tous les élèves</button>
    <div class="id"><span class="avatar av-${esc(f.sexe)}">${ICON[f.sexe]||ICON[""]}</span>
      <div style="min-width:0"><h1>${nom(f)}</h1><div class="muted">${esc(f.classe)} · ${esc(f.site)}</div></div></div>
    <dl class="facts">
      <div><dt>Classe</dt><dd>${esc(f.classe)}</dd></div>
      <div><dt>Prof principal</dt><dd>${f.pp?esc(f.pp):'<span class="none">Non renseigné</span>'}</dd></div>
      ${f.naissance?`<div><dt>Date de naissance</dt><dd>${dateFr(f.naissance)}</dd></div>`:""}
      <div class="${f.naissance?"":"wide"}"><dt>Accompagnement</dt><dd>${esc(f.type||"—")}</dd></div>
      <div class="wide"><dt>AESH habituelle${f.aesh.length>1?"s":""}</dt><dd>${f.aesh.length?f.aesh.map(a=>esc(a.n)+(a.h?` <span class="muted">(${esc(String(a.h).replace(".",","))} h)</span>`:"")).join(" · "):'<span class="none">Pas d\'AESH</span>'}</dd></div>
    </dl>
    ${f.essentiel.length?`<div class="essentiel"><h2>L'essentiel à savoir</h2><ol>${f.essentiel.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`:""}
    <section class="block"><h2>Ses besoins</h2>
      ${f.troubles.length?`<div class="tags">${tags(f.troubles)}</div>`:""}
      ${f.observations.length?`<h3 class="sub-h">Ce que disent ses documents</h3>${list(f.observations)}`:""}
      ${vide?`<p class="none">Pas encore renseigné dans ses documents. Demande à la coordination.</p>`:""}
    </section>
    <section class="block"><h2>Comment l'accompagner</h2>
      ${f.preconisations.length?`<h3 class="sub-h">Préconisations du GEVA-Sco / PPS</h3>${list(f.preconisations)}`:""}
      ${f.amenagements.length?`<h3 class="sub-h">Aménagements prévus</h3><div class="chips">${f.amenagements.map(a=>`<span class="am">${esc(a)}</span>`).join("")}</div>`:""}
      ${f.reperes.length?`<h3 class="sub-h">Repères selon ses besoins <small>· conseils généraux</small></h3>${list(f.reperes)}`:""}
      ${!f.preconisations.length&&!f.amenagements.length&&!f.reperes.length?`<p class="none">Pas encore de préconisations. Demande à la coordination.</p>`:""}
    </section>
    <section class="block"><h2>Dossier</h2><div class="docs">
      ${doc("Notification",esc(f.statut))}
      ${doc("Période notifiée",f.notifDebut||f.notifFin?`${f.notifDebut?"du "+dateFr(f.notifDebut):""} ${f.notifFin?"au "+dateFr(f.notifFin):""}`:"")}
      ${doc("GEVA-Sco",f.gevascoDate?"du "+dateFr(f.gevascoDate):"")}
      ${doc("Prochaine ESS",f.essDate?dateFr(f.essDate):"")}
      ${doc("Enseignant référent",esc(f.referent))}
      ${doc("Documents",f.sources.length?f.sources.map(esc).join("<br>"):"")}
    </div></section>
    <p class="small muted">Les repères généraux ne remplacent pas le PPS.</p>`;
  document.getElementById("back").onclick = () => { location.hash = ""; };
}

window.addEventListener("hashchange", route);
(async () => {
  const code = ls.get();
  if(code){ try{ app.innerHTML = `<p class="muted" style="margin-top:20vh;text-align:center">Ouverture…</p>`; await ouvrir(code); }catch(e){ ls.del(); } }
  route();
})();
</script>
</body>
</html>
